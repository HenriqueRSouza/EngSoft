# name: Nome do workflow exibido na aba Actions do GitHub
name: Build Docker image and deploy to Azure Web App

# on: Gatilhos que iniciam o workflow
on:
  push:
    branches:
      - 'main'
      - 'feature/dockerfile'
  workflow_dispatch:

jobs:

  # build: Cria a imagem Docker e publica no GitHub Container Registry (ghcr.io) e no Docker Hub
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # necessário para o checkout
      packages: write  # necessário para publicar a imagem no ghcr.io
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      # Gera o nome da imagem em minúsculas (exigência do registry)
      - name: Define image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Faz login no ghcr.io usando o token automático do GitHub Actions
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Faz login no Docker Hub usando os secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Constrói a imagem a partir do Dockerfile e envia para o ghcr.io e o Docker Hub
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/engsoft:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/engsoft:latest

  # deploy: Publica a imagem no Azure App Service
  # Só roda quando a variável AZURE_WEBAPP_NAME estiver configurada no repositório
  # (Settings > Secrets and variables > Actions > Variables), ou seja, depois que
  # o App Service for criado.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.build.outputs.image }}
