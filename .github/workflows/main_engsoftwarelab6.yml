# name: Define o nome do workflow
name: Build and deploy Python app to Azure Web App - EngSoftwareLab6

# on: Define os gatilhos que iniciam este workflow
on:
  # push: O workflow é disparado quando há um commit na branch 'main'
  push:
    branches:
      # 'main': A branch específica que monitora para gatilho de push
      - 'main'
  # workflow_dispatch: Permite o disparo manual do workflow através da UI do GitHub Actions
  workflow_dispatch:

# jobs: Define os trabalhos qe serão executados na pipeline
jobs:

  # build: Define a primeira etapa principal chamada 'build', responsável por compilar e preparar o aplicativo
  build:
    # runs-on: Especifica a máquina virtual onde será executado, ubuntu-latest é uma imagem Linux mais recente
    runs-on: ubuntu-latest
    # permissions: Define os permissões de acesso necessárias para as ações
    permissions:
      # contents: read: Permissão necessária para que a ação actions/checkout possa baixar o repositório
      contents: read #This is required for actions/checkout

    # steps: Define uma lista de passos a serem executados em ordem
    steps:
      # - name: Define o nome deste passo para identificar sua função
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # - uses: Configura a versão do Python
      - uses: actions/setup-python@v5
        with:
          # python-version: '3.14': Define qual versão do Python será usada
          python-version: '3.12'

      # - name: Cria e inicia um ambiente virtual para Python e instala as dependências especificadas no requirements.txt
      - name: Create and Start virtual environment and Install dependencies
        # run: Executa comandos Linux para criar o venv ativar e instalar pacotes pip
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
          
  # deploy: Define o segundo trabalho principal chamado 'deploy', que depende da conclusão do job 'build'
  deploy:
    # runs-on: Especifica a máquina virtual onde este trabalho será executado (ubuntu-latest)
    runs-on: ubuntu-latest
    # needs: Garante que este job só seja executado após o sucesso do job 'build'
    needs: build
    # permissions: Define as permissões necessárias para autenticação com Azure e leitura de conteúdo
    permissions:
      # id-token: write: Usado na autenticação OAuth2/Azure AD
      id-token: write 
      # contents: read: Permissão necessária para acessar arquivos do repositório se necessário no deploy
      contents: read

    # steps: Define a lista de passos para o job de deploy
    steps:
      # - name: Baixa o arquivo artefato criado pelo job 'build'
      - uses: actions/download-artifact@v4
        with:
          # name: python-app: Nome do artefato que será baixado
          name: python-app
          path: .

      # Adição de novo step antes da ação de deploy
      - name: Print Welcome Message to Console
        run: echo "Henrique Ribeiro Starting deployment of EngSoftwareLab6 to Azure Web App Production Slot."

      # - name: Fazer login no serviço Azure usando credenciais da Service Principal (Secrets)
      - uses: azure/login@v2
        with:
          # client-id: Identificador do aplicativo registrado no Azure AD
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_62E9CB193B94444DBD2F368D30A4858C }}
          # tenant-id: Identificador do diretório Azure associado à conta
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AC10D38D137C4FC1BCD8C26A93F546A7 }}
          # subscription-id: ID do Azure Subscription onde o App Service está hospedado
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_ECFFB025CCE44A03BE1D0685FD2E4BCC }}

      # Ação que realiza o deploy real do código para a Web App no Azure
      - uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          # app-name: 'EngSoftwareLab6': Nome da aplicação Web App Azure
          app-name: 'EngSoftwareLab6'
          # slot-name: Destina-se à versão de produção da aplicação
          slot-name: 'Production'
