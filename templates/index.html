<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Mackenzie</title>
  <style>
    :root { --vermelho: #c8102e; --fundo: #f5f1ea; --texto: #1f1f1f; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fundo); color: var(--texto); padding: 16px;
    }
    .card {
      background: #fff; max-width: 480px; width: 100%; padding: 40px 32px;
      border-radius: 16px; border-top: 6px solid var(--vermelho);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08); text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 2rem; color: var(--vermelho); }
    p { margin: 6px 0; font-size: 1.1rem; }
    .tag {
      display: inline-block; margin-top: 20px; padding: 6px 14px; border-radius: 999px;
      background: var(--vermelho); color: #fff; font-size: .85rem; font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Olá, sou aluno do Mackenzie</h1>
    <p>Meu nome é <strong>{{ nome }}</strong></p>
    <p>RA <strong>{{ ra }}</strong></p>
    <span class="tag">Flask + Docker</span>
  </main>
</body>
</html>
